<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="An accessible, mobile-first lesson plan for listening and reading practice.">
  <title>Accessible lesson plan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#lesson-list">Skip to lesson plans</a>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">Learning resources</p>
      <h1>Lesson plan</h1>
      <p class="intro">Open each section to explore the lesson. You can use a keyboard, touchscreen, or screen reader.</p>
    </div>
  </header>

  <main class="container" id="main-content">
    <section aria-labelledby="lessons-heading">
      <h2 id="lessons-heading">Your lessons</h2>
      <p id="status" class="status" role="status" aria-live="polite">Loading lesson plans…</p>
      <div id="lesson-list" class="lesson-list" aria-busy="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>Lesson information is provided in an easy-to-open format.</p></div>
  </footer>
</body>
</html>
